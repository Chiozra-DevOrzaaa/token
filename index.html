<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zihan Store - Bahan Bangunan Jl Sawangan Depok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
:root{--p:#b91c1c;--bg:#111827;--txt:#f9fafb;--card:#1f2937;--line:#374151}
body{background:var(--bg);color:var(--txt);min-height:100vh}
.wrap{max-width:1300px;margin:auto;padding:15px}
.header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:2px solid var(--p);flex-wrap:wrap;gap:15px}
.logo-area{display:flex;align-items:center;gap:15px}
.logo-slider{width:60px;height:60px;border-radius:12px;overflow:hidden;border:2px solid var(--p);position:relative}
.logo-wrap{display:flex;transition:.5s;height:100%}
.logo-slide{min-width:100%;height:100%}
.logo-slide img,.logo-slide video{width:100%;height:100%;object-fit:cover}
.logo-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;padding:2px 6px;cursor:pointer;border-radius:50%;font-size:12px;opacity:0;transition:.3s}
.logo-slider:hover.logo-btn{opacity:1}
.logo-prev{left:2px}.logo-next{right:2px}
.store-name{font-size:32px;font-weight:800;background:linear-gradient(45deg,var(--p),#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.alamat{font-size:14px;opacity:.8;margin-top:4px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--p);color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;transition:.3s}
.btn:hover{background:#991b1b;transform:translateY(-2px)}
.btn-admin{background:#059669}
.btn-keranjang{background:#7c3aed;position:relative}
.cart-count{position:absolute;top:-8px;right:-8px;background:#f59e0b;color:#000;width:22px;height:22px;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:800}
.tools{display:grid;grid-template-columns:1fr auto;gap:12px;margin:25px 0}
input,select,textarea{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p)}
input[type="file"]{padding:8px;background:var(--bg)}
.produk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}
.produk-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.3s}
.produk-card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(185,28,.3)}
.slider{position:relative;height:220px;overflow:hidden}
.slider-wrap{display:flex;transition:.5s;height:100%}
.slide{min-width:100%;height:100%}
.slide img{width:100%;height:100%;object-fit:cover}
.slider-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;border:none;padding:8px 12px;cursor:pointer;border-radius:50%;font-size:18px}
.prev{left:10px}.next{right:10px}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,.5);cursor:pointer}
.dot.active{background:var(--p)}
.produk-info{padding:18px}
.nama-barang{font-size:17px;font-weight:700;margin-bottom:6px}
.model-barang{font-size:13px;opacity:.7;margin-bottom:6px}
.kat-barang{font-size:12px;opacity:.6;margin-bottom:12px}
.harga{color:var(--p);font-size:24px;font-weight:800;margin-bottom:15px}
.aksi{display:flex;gap:8px}
.btn-beli{flex:1;background:#25D366;padding:12px;border-radius:10px;color:#fff;text-align:center;text-decoration:none;font-weight:700}
.btn-cart{flex:1;background:#7c3aed}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;align-items:center;justify-content:center;padding:15px}
.modal-box{background:var(--card);border:1px solid var(--line);padding:25px;border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-box h3{margin-bottom:20px;color:var(--p)}
.form-group{margin:15px 0}
.form-group label{display:block;margin-bottom:6px;font-weight:600}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px;margin:10px 0}
.cart-total{font-size:22px;font-weight:800;color:var(--p);text-align:right;margin:20px 0}
.footer{margin-top:80px;padding:40px 0;border-top:1px solid var(--line);text-align:center}
.jam-op{margin:25px 0;padding:20px;background:var(--card);border-radius:14px}
.jam-op h4{color:var(--p);margin-bottom:15px}
.jam-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;text-align:left}
.jam-item{padding:8px;background:var(--bg);border-radius:8px}
.credit{margin-top:25px;font-weight:700;opacity:.8;font-size:14px}
.hide{display:none!important}
.preview-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
.preview-item{position:relative}
.preview-img{width:100%;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.hapus-foto{position:absolute;top:-5px;right:-5px;background:#dc2626;color:#fff;border:none;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}
.upload-info{font-size:12px;opacity:.6;margin-top:5px}
@media(max-width:768px){.tools{grid-template-columns:1fr}.produk-grid{grid-template-columns:1fr}.header{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo-area">
      <div class="logo-slider">
        <div class="logo-wrap" id="logoSlider">
          <!-- Logo di-render JS -->
        </div>
        <button class="logo-btn logo-prev" onclick="logoPrev()">‹</button>
        <button class="logo-btn logo-next" onclick="logoNext()">›</button>
      </div>
      <div>
        <div class="store-name">ZIHAN STORE</div>
        <div class="alamat">📍 Jl Sawangan Depok</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-keranjang" onclick="bukaCart()">🛒 Keranjang <span class="cart-count" id="cartCount">0</span></button>
      <button class="btn btn-admin" onclick="bukaAdmin()" id="adminBtn">Admin Panel</button>
    </div>
  </div>

  <div class="tools">
    <input type="text" id="search" placeholder="Cari produk..." oninput="filterProduk()">
    <input type="text" id="filterKat" placeholder="Filter kategori..." oninput="filterProduk()">
    <select id="sortHarga" onchange="filterProduk()">
      <option value="">Urutkan</option>
      <option value="murah">Harga Termurah</option>
      <option value="mahal">Harga Termahal</option>
    </select>
  </div>

  <div class="produk-grid" id="produkGrid"></div>

  <div class="footer">
    <div style="font-size:20px;font-weight:800;margin-bottom:10px">Zihan Store</div>
    <div>📍 Jl Sawangan Depok</div>
    <div style="margin:15px 0">📱 WhatsApp: <a href="https://wa.me/6285759441816" style="color:var(--p);text-decoration:none;font-weight:700">6285759441816</a></div>

    <div class="jam-op">
      <h4>⏰ JAM OPERASIONAL</h4>
      <div class="jam-list">
        <div class="jam-item"><b>Senin</b><br>09:00 - 17:00</div>
        <div class="jam-item"><b>Selasa</b><br>09:00 - 17:00</div>
        <div class="jam-item"><b>Rabu</b><br>09:00 - 17:00</div>
        <div class="jam-item"><b>Kamis</b><br>09:00 - 17:00</div>
        <div class="jam-item"><b>Jum'at</b><br>09:00 - 17:00</div>
        <div class="jam-item"><b>Sabtu</b><br>09:00 - 17:00</div>
        <div class="jam-item"><b>Minggu</b><br>09:00 - 15:00</div>
      </div>
    </div>

    <div class="credit">Website by: CHIOZRA MAHASARKA ARDIANA</div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box" id="modalContent"></div>
</div>

<script>
let produk=JSON.parse(localStorage.getItem('zihan_produk'))||[
{id:1,nama:"Concrete Wall Panel Archit",model:"Archit Series",harga:120000,kat:"WPC Panel",stok:50,foto:["https://images.unsplash.com/photo-1618220179428-22790b461013?w=600","https://images.unsplash.com/photo-1600210492493-0946911123ea?w=600"]},
{id:2,nama:"Holow Kisi Kisi WPC",model:"Kisi 5x5cm",harga:65000,kat:"WPC Panel",stok:100,foto:["https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600"]},
{id:3,nama:"Square Holow WPC Eksterior",model:"Square Outdoor",harga:95000,kat:"WPC Panel",stok:75,foto:["https://images.unsplash.com/photo-1560448204-603b3fc33ddc?w=600"]},
{id:4,nama:"Marbel 122*2900",model:"Glossy White",harga:250000,kat:"Marmer",stok:30,foto:["https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=600"]},
{id:5,nama:"Holow WPC Interior",model:"Interior Slim",harga:55000,kat:"WPC Panel",stok:200,foto:["https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=600"]},
{id:6,nama:"WPC Wall Panel",model:"3D Series",harga:125000,kat:"WPC Panel",stok:80,foto:["https://images.unsplash.com/photo-1618220048045-10a6dbdf83e0?w=600"]},
{id:7,nama:"Pintu Baja",model:"Minimalis",harga:0,kat:"Pintu Baja",stok:20,foto:["https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600"]},
{id:8,nama:"Marmer",model:"Import Italy",harga:0,kat:"Marmer",stok:15,foto:["https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=600"]},
{id:9,nama:"Pintu Baja Premium",model:"Double + Kaca",harga:1500000,kat:"Pintu Baja",stok:10,foto:["https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600"]},
{id:10,nama:"Plint Tembok Rhino",model:"PVC 10cm",harga:95000,kat:"Plint",stok:150,foto:["https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=600"]},
{id:11,nama:"Vinyl Rhino",model:"Wood Series",harga:0,kat:"Vinyl Lantai",stok:60,foto:["https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=600"]},
{id:12,nama:"Pelapis Lantai LVT Vinyl",model:"4mm Click /dus",harga:360000,kat:"Vinyl Lantai",stok:40,foto:["https://images.unsplash.com/photo-1560448204-603b3fc33ddc?w=600"]},
{id:13,nama:"Atap UPVC Doubel Layer 830",model:"830mm /m",harga:120000,kat:"Atap UPVC",stok:90,foto:["https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600"]}
];

let cart=JSON.parse(localStorage.getItem('zihan_cart'))||[];
let logo=JSON.parse(localStorage.getItem('zihan_logo_list'))||["https://via.placeholder.com/60x60/b91c1c/fff?text=ZS"];
let currentSlide={},adminAttempts=0,adminBlocked=localStorage.getItem('admin_blocked')==='true',currentLogo=0;
let tempFoto=[];

if(adminBlocked)document.getElementById('adminBtn').classList.add('hide');

function renderLogo(){
  const wrap=document.getElementById('logoSlider');
  wrap.innerHTML=logo.map(url=>{
    if(url.match(/\.(mp4|webm|mov)$/i)){
      return `<div class="logo-slide"><video src="${url}" autoplay muted loop></video></div>`;
    }else{
      return `<div class="logo-slide"><img src="${url}"></div>`;
    }
  }).join('');
  updateLogo();
}

function logoNext(){
  currentLogo=(currentLogo+1)%logo.length;
  updateLogo();
}

function logoPrev(){
  currentLogo=(currentLogo-1+logo.length)%logo.length;
  updateLogo();
}

function updateLogo(){
  document.getElementById('logoSlider').style.transform=`translateX(-${currentLogo*100}%)`;
}
function renderProduk(arr=produk){
  const grid=document.getElementById('produkGrid');
  grid.innerHTML=arr.map(p=>{
    currentSlide[p.id]=0;
    return`
    <div class="produk-card">
      <div class="slider">
        <div class="slider-wrap" id="slider-${p.id}">
          ${p.foto.map((f,i)=>`<div class="slide"><img src="${f}" loading="lazy"></div>`).join('')}
        </div>
        ${p.foto.length>1?`
        <button class="slider-btn prev" onclick="slidePrev(${p.id})">‹</button>
        <button class="slider-btn next" onclick="slideNext(${p.id})">›</button>
        <div class="dots">${p.foto.map((_,i)=>`<div class="dot ${i===0?'active':''}" onclick="goToSlide(${p.id},${i})"></div>`).join('')}</div>`:''}
      </div>
      <div class="produk-info">
        <div class="nama-barang">${p.nama}</div>
        <div class="model-barang">Model: ${p.model} | Stok: ${p.stok}</div>
        <div class="kat-barang">Kategori: ${p.kat}</div>
        <div class="harga">${p.harga?`Rp ${p.harga.toLocaleString('id-ID')}${p.nama.includes('/m')?'/m':p.nama.includes('/dus')?'/dus':''}`:'Tanya Harga'}</div>
        <div class="aksi">
          <a href="https://wa.me/6285759441816?text=Mau order ${encodeURIComponent(p.nama+' '+p.model)}" class="btn-beli">Chat WA</a>
          <button class="btn btn-cart" onclick="addToCart(${p.id})">+ Keranjang</button>
        </div>
      </div>
    </div>`
  }).join('');
}

function slideNext(id){
  const p=produk.find(x=>x.id==id);
  currentSlide[id]=(currentSlide[id]+1)%p.foto.length;
  updateSlide(id);
}

function slidePrev(id){
  const p=produk.find(x=>x.id==id);
  currentSlide[id]=(currentSlide[id]-1+p.foto.length)%p.foto.length;
  updateSlide(id);
}

function goToSlide(id,i){
  currentSlide[id]=i;
  updateSlide(id);
}

function updateSlide(id){
  document.getElementById(`slider-${id}`).style.transform=`translateX(-${currentSlide[id]*100}%)`;
  const dots=document.querySelectorAll(`#slider-${id} ~.dots.dot`);
  dots.forEach((d,i)=>d.classList.toggle('active',i===currentSlide[id]));
}

function filterProduk(){
  let filtered=[...produk];
  const search=document.getElementById('search').value.toLowerCase();
  const kat=document.getElementById('filterKat').value.toLowerCase();
  const sort=document.getElementById('sortHarga').value;

  if(search)filtered=filtered.filter(p=>p.nama.toLowerCase().includes(search)||p.model.toLowerCase().includes(search));
  if(kat)filtered=filtered.filter(p=>p.kat.toLowerCase().includes(kat));
  if(sort==='murah')filtered.sort((a,b)=>a.harga-b.harga);
  if(sort==='mahal')filtered.sort((a,b)=>b.harga-a.harga);

  renderProduk(filtered);
}

function addToCart(id){
  const p=produk.find(x=>x.id==id);
  const exist=cart.find(x=>x.id==id);
  if(exist)exist.qty++;
  else cart.push({...p,qty:1});
  localStorage.setItem('zihan_cart',JSON.stringify(cart));
  updateCartCount();
  alert('✅ Ditambahkan ke keranjang!');
}

function updateCartCount(){
  document.getElementById('cartCount').textContent=cart.reduce((a,b)=>a+b.qty,0);
}

function bukaCart(){
  const modal=document.getElementById('modal');
  const content=document.getElementById('modalContent');
  const total=cart.reduce((a,b)=>a+b.harga*b.qty,0);

  content.innerHTML=`
    <h3>🛒 Keranjang Belanja</h3>
    ${cart.length?cart.map(item=>`
      <div class="cart-item">
        <div>
          <b>${item.nama}</b><br>
          <small>${item.model} - Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</small>
        </div>
        <button class="btn" style="background:#dc2626;padding:6px 12px" onclick="hapusCart(${item.id})">Hapus</button>
      </div>
    `).join(''):'<p style="text-align:center;opacity:.6">Keranjang kosong</p>'}
    <div class="cart-total">Total: Rp ${total.toLocaleString('id-ID')}</div>
    <button class="btn" style="width:100%;background:#25D366" onclick="checkout()">Checkout via WhatsApp</button>
    <button class="btn" style="width:100%;margin-top:10px;background:#475569" onclick="tutupModal()">Tutup</button>
  `;
  modal.style.display='flex';
}

function hapusCart(id){
  cart=cart.filter(x=>x.id!=id);
  localStorage.setItem('zihan_cart',JSON.stringify(cart));
  updateCartCount();
  bukaCart();
}

function checkout(){
  if(!cart.length)return alert('Keranjang kosong!');
  let teks='Halo ZIHAN STORE, saya mau order:%0A%0A';
  cart.forEach(item=>{
    teks+=`- ${item.nama} (${item.model}) x${item.qty} = Rp ${(item.harga*item.qty).toLocaleString('id-ID')}%0A`;
  });
  const total=cart.reduce((a,b)=>a+b.harga*b.qty,0);
  teks+=`%0A*Total: Rp ${total.toLocaleString('id-ID')}*`;
  window.open(`https://wa.me/6285759441816?text=${teks}`,'_blank');
  cart=[];
  localStorage.setItem('zihan_cart',JSON.stringify(cart));
  updateCartCount();
  tutupModal();
}

function bukaAdmin(){
  if(adminBlocked)return alert('❌ Akses admin sudah dinonaktifkan permanen!');
  const modal=document.getElementById('modal');
  const content=document.getElementById('modalContent');
  content.innerHTML=`
    <h3>🔐 Admin Panel</h3>
    <div class="form-group">
      <label>Masukkan Password:</label>
      <input type="password" id="adminPw" placeholder="Password admin">
    </div>
    <button class="btn" style="width:100%" onclick="cekAdmin()">Masuk</button>
    <button class="btn" style="width:100%;margin-top:10px;background:#475569" onclick="tutupModal()">Batal</button>
  `;
  modal.style.display='flex';
}

function cekAdmin(){
  const pw=document.getElementById('adminPw').value;
  if(pw==='zihan123'){
    adminAttempts=0;
    showAdminPanel();
  }else{
    adminAttempts++;
    if(adminAttempts>=3){
      localStorage.setItem('admin_blocked','true');
      document.getElementById('adminBtn').classList.add('hide');
      tutupModal();
      alert('❌ Password salah 3x! Fitur admin dinonaktifkan permanen.');
    }else{
      alert(`❌ Password salah! Sisa ${3-adminAttempts}x kesempatan`);
    }
  }
}

function showAdminPanel(){
  const content=document.getElementById('modalContent');
  content.innerHTML=`
    <h3>⚙️ Admin Panel</h3>
    <div class="form-group"><label>Nama Barang:</label><input type="text" id="namaBaru" placeholder="Ketik nama barang"></div>
    <div class="form-group"><label>Model:</label><input type="text" id="modelBaru" placeholder="Ketik model barang"></div>
    <div class="form-group"><label>Harga:</label><input type="number" id="hargaBaru" placeholder="Ketik harga"></div>
    <div class="form-group"><label>Stok:</label><input type="number" id="stokBaru" placeholder="Ketik stok"></div>
    <div class="form-group"><label>Kategori:</label><input type="text" id="katBaru" placeholder="Ketik kategori sendiri"></div>
    <div class="form-group"><label>URL Foto (pisah koma jika banyak):</label><textarea id="fotoBaru" rows="2" placeholder="https://foto1.jpg, https://foto2.jpg"></textarea></div>
    <button class="btn" style="width:100%" onclick="tambahProduk()">+ Tambah Produk</button>

    <h4 style="margin:30px 0 15px">📦 List Produk</h4>
    <div style="max-height:300px;overflow-y:auto">
      ${produk.map(p=>`
        <div class="cart-item">
          <div><b>${p.nama}</b><br><small>${p.model} - Rp ${p.harga.toLocaleString('id-ID')} | ${p.kat} | ${p.foto.length} foto</small></div>
          <div style="display:flex;gap:5px">
            <button class="btn" style="padding:6px 12px;background:#059669" onclick="editProduk(${p.id})">Edit</button>
            <button class="btn" style="padding:6px 12px;background:#dc2626" onclick="hapusProduk(${p.id})">Hapus</button>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="btn" style="width:100%;margin-top:15px;background:#475569" onclick="tutupModal()">Tutup</button>
  `;
}

function tambahProduk(){
  const nama=document.getElementById('namaBaru').value;
  const model=document.getElementById('modelBaru').value;
  const harga=parseInt(document.getElementById('hargaBaru').value)||0;
  const stok=parseInt(document.getElementById('stokBaru').value)||0;
  const kat=document.getElementById('katBaru').value;
  const foto=document.getElementById('fotoBaru').value.split(',').map(f=>f.trim()).filter(f=>f);

  if(!nama||!model||!kat)return alert('Nama, Model & Kategori wajib diisi!');

  produk.push({id:Date.now(),nama,model,harga,kat,stok,foto:foto.length?foto:['https://via.placeholder.com/600x400?text=No+Image']});
  localStorage.setItem('zihan_produk',JSON.stringify(produk));
  renderProduk();
  showAdminPanel();
  alert('✅ Produk berhasil ditambah!');
}

function editProduk(id){
  const p=produk.find(x=>x.id==id);
  const content=document.getElementById('modalContent');
  content.innerHTML=`
    <h3>✏️ Edit Produk</h3>
    <div class="form-group"><label>Nama Barang:</label><input type="text" id="editNama" value="${p.nama}"></div>
    <div class="form-group"><label>Model:</label><input type="text" id="editModel" value="${p.model}"></div>
    <div class="form-group"><label>Harga:</label><input type="number" id="editHarga" value="${p.harga}"></div>
    <div class="form-group"><label>Stok:</label><input type="number" id="editStok" value="${p.stok}"></div>
    <div class="form-group"><label>Kategori:</label><input type="text" id="editKat" value="${p.kat}"></div>
    <div class="form-group"><label>URL Foto (pisah koma untuk banyak):</label><textarea id="editFoto" rows="3">${p.foto.join(', ')}</textarea></div>
    <button class="btn" style="width:100%;background:#059669" onclick="simpanEditProduk(${p.id})">💾 Simpan Perubahan</button>
    <button class="btn" style="width:100%;margin-top:10px;background:#475569" onclick="showAdminPanel()">← Kembali</button>
  `;
}

function simpanEditProduk(id){
  const p=produk.find(x=>x.id==id);
  const nama=document.getElementById('editNama').value;
  const model=document.getElementById('editModel').value;
  const harga=parseInt(document.getElementById('editHarga').value)||0;
  const stok=parseInt(document.getElementById('editStok').value)||0;
  const kat=document.getElementById('editKat').value;
  const foto=document.getElementById('editFoto').value.split(',').map(f=>f.trim()).filter(f=>f);

  if(!nama||!model||!kat)return alert('Nama, Model & Kategori wajib diisi!');

  p.nama=nama;p.model=model;p.harga=harga;p.stok=stok;p.kat=kat;p.foto=foto.length?foto:['https://via.placeholder.com/600x400?text=No+Image'];
  localStorage.setItem('zihan_produk',JSON.stringify(produk));
  renderProduk();
  showAdminPanel();
  alert('✅ Produk + Foto berhasil diupdate!');
}

function hapusProduk(id){
  if(confirm('Yakin hapus produk ini?')){
    produk=produk.filter(x=>x.id!=id);
    localStorage.setItem('zihan_produk',JSON.stringify(produk));
    renderProduk();
    showAdminPanel();
    alert('✅ Produk berhasil dihapus!');
  }
}

function tutupModal(){
  document.getElementById('modal').style.display='none';
}

window.onclick=e=>{if(e.target.classList.contains('modal'))e.target.style.display='none'}

// Auto slide produk - ANTI LAG
let slideInterval;
let isPageVisible = true;

function startAutoSlide(){
  stopAutoSlide();
  slideInterval = setInterval(()=>{
    if(!isPageVisible) return;
    produk.forEach(p=>{
      if(p.foto.length>1){
        const el = document.getElementById(`slider-${p.id}`);
        if(!el) return;
        const rect = el.getBoundingClientRect();
        const isVisible = rect.top < window.innerHeight && rect.bottom > 0;
        if(isVisible) slideNext(p.id);
      }
    });
  },4000);
}

function stopAutoSlide(){
  if(slideInterval) clearInterval(slideInterval);
}

document.addEventListener('visibilitychange', ()=>{
  isPageVisible =!document.hidden;
  if(isPageVisible) startAutoSlide();
  else stopAutoSlide();
});

document.getElementById('produkGrid').addEventListener('mouseenter', stopAutoSlide, true);
document.getElementById('produkGrid').addEventListener('mouseleave', startAutoSlide, true);

// Auto slide logo juga biar gacor
setInterval(()=>{ if(logo.length>1) logoNext(); },5000);

startAutoSlide();
renderLogo();
renderProduk();
updateCartCount();
</script>
</body>
</html>
